# Reference-data registry
#
# One entry per upstream source this project can use. The repository does not
# redistribute restricted data: a source with `redistribute: false` is obtained
# by the user, and only its version/URL/license is recorded here.
#
# When a snapshot is downloaded, record `retrieved`, `release` and `sha256` so a
# run manifest can pin it.

