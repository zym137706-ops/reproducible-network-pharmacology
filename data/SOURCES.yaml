  name: HGNC gene nomenclature
  url: https://www.genenames.org/download/archive/
  license: "CC0; attribution recommended"
  redistribute: true
  release: "snapshot Last-Modified 2026-10-16"
  retrieved: "2026-10-21T04:28:03Z"
  sha256: "af156dd54890b96eb8dc7e989d6a880669553ade7bcfea5d1cc4cd6cb494d4a3"
  note: "derived hgnc_map.tsv committed under examples/demo/inputs; raw file local only"

