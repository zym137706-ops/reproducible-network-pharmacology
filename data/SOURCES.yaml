# Reference-data registry
#
# One entry per upstream source this project can use. The repository does not
# redistribute restricted data: a source with `redistribute: false` is obtained
# by the user, and only its version/URL/license is recorded here.
#
# When a snapshot is downloaded, record `retrieved`, `release` and `sha256` so a
# run manifest can pin it.

hgnc:
  name: HGNC gene nomenclature
  url: https://www.genenames.org/download/archive/
  license: "free to use with attribution (see genenames.org)"
  redistribute: false
  release: "2026-09"
  retrieved: null
  sha256: null

pubchem:
  name: PubChem compound structures
  url: https://pubchem.ncbi.nlm.nih.gov/
  license: "verify PubChem terms before redistribution; fetched structures stay in data/local"
  redistribute: false
  release: "retrieved 2026-10-20"
  retrieved: "2026-10-20T12:40:37Z"
  sha256: "c43811542fe1ef1856c8e9aefd2c1805e400d0c87d6093117565c04e9ebc6d02"
  note: "SMILES + ConnectivitySMILES; local derivation only; regenerate with scripts/fetch_pubchem_structures.py"

