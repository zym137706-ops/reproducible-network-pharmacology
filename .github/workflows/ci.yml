name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install from lock file
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv sync --locked --extra dev --extra chem
      - name: Lint
        run: uv run ruff check .
      - name: Test
        env:
          RNP_REQUIRE_CHEM: "1"
        run: uv run pytest -q
      - name: CLI quickstart (enrichment is covered by the R job)
        run: |
          uv run rnp --version
          uv run rnp validate --config examples/quickstart/run.yaml
          uv run rnp ingest stp --config examples/quickstart/run.yaml --run-id quickstart
          uv run rnp intersect --config examples/quickstart/run.yaml \
            --targets results/quickstart/targets.tsv
          uv run rnp network --config examples/quickstart/run.yaml \
            --intersect results/quickstart/intersect
          uv run rnp report --config examples/quickstart/run.yaml \
            --run-dir results/quickstart
          uv run rnp manifest --run-dir results/quickstart --check-inputs
      - name: Offline synthetic demo
        run: uv run python scripts/synthetic_demo.py --out .demo
      - name: Selection end-to-end on synthetic inputs
        run: |
          uv run python - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          import yaml

          root = Path.cwd()
          source = root / "tests/fixtures/run/inputs"
          with tempfile.TemporaryDirectory() as raw:
              tmp = Path(raw)
              (tmp / "compounds.tsv").write_text(
                  "name\tstp_file\nQuercetin\tcompound_a.csv\nKaempferol\tcompound_b.csv\n",
                  encoding="utf-8",
              )
              (tmp / "decisions.tsv").write_text(
                  "compound\tdecision\treason_codes\trules_version\treviewer\n"
                  "Quercetin\tinclude\t\tci-v1\tci\n"
                  "Kaempferol\texclude\tout_of_scope\tci-v1\tci\n",
                  encoding="utf-8",
              )
              config = {
                  "project": "selection-ci",
                  "species": "Homo_sapiens",
                  "inputs": {
                      "compounds": str(tmp / "compounds.tsv"),
                      "stp_dir": str(source / "stp"),
                      "disease_genes": str(source / "disease_genes.txt"),
                      "hgnc_map": str(root / "tests/fixtures/hgnc/hgnc_map.tsv"),
                      "selection": str(tmp / "decisions.tsv"),
                  },
                  "thresholds": {"stp_probability": 0.10},
                  "enrichment": {"engine": "r", "gene_sets": "GO_BP"},
                  "network": {"disease_label": "Fixture disease"},
                  "outputs": {"dir": str(tmp / "results")},
              }
              (tmp / "run.yaml").write_text(
                  yaml.safe_dump(config, sort_keys=False), encoding="utf-8"
              )
              base = ["--config", str(tmp / "run.yaml")]

              def rnp(*args):
                  done = subprocess.run(
                      [sys.executable, "-m", "rnp.cli", *args],
                      cwd=root,
                      capture_output=True,
                      text=True,
                  )
                  assert done.returncode == 0, (args, done.returncode, done.stderr)
                  return json.loads(done.stdout)

              rnp("validate", *base)
              compounds = rnp("ingest", "compounds", *base, "--run-id", "s")["run_dir"]
              selection = rnp(
                  "compounds", "select", *base, "--compounds", compounds, "--run-id", "sel"
              )["run_dir"]
              ingest = rnp(
                  "ingest",
                  "stp",
                  *base,
                  "--run-id",
                  "i1",
                  "--compounds",
                  compounds,
                  "--selection",
                  selection,
              )
              assert ingest["stage_status"] == "complete", ingest
              run = Path(ingest["run_dir"])
              audit = json.loads((run / "stp_audit.json").read_text(encoding="utf-8"))
              assert audit["schema_version"] == "1.2", audit["schema_version"]
              assert audit["summary"]["files_not_selected"] == 1, audit["summary"]
              header = (run / "compounds_registered.tsv").read_text(encoding="utf-8").splitlines()[0]
              assert header.endswith("\tselection_status"), header
              targets = (run / "targets.tsv").read_text(encoding="utf-8").splitlines()[1:]
              assert {line.split("\t")[3] for line in targets} == {"compound_a.csv"}, targets
              intersect = rnp("intersect", *base, "--targets", str(run / "targets.tsv"))
              assert intersect["groups"]["all"]["compounds"] == 1, intersect
              rnp("network", *base, "--intersect", str(run / "intersect"))
              rnp("report", *base, "--run-dir", str(run))
              report = next((run / "report").glob("*.md")).read_text(encoding="utf-8")
              line = "- Compound selection: 1 selected, 1 excluded, 0 needs review or quarantined"
              assert line in report, report
              assert rnp("manifest", "--run-dir", str(run), "--check-inputs")["drift"] == []
          print("selection end-to-end ok")
          PY
      - name: Build wheel and check packaged resources
        if: matrix.python-version == '3.12'
        run: |
          uv build --wheel
          python - <<'PY'
          import glob
          import zipfile

          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(name.endswith("rnp/R/venny.R") for name in names), names
          assert any(name.endswith("rnp/schemas/run.schema.json") for name in names), names
          print("wheel resources ok:", wheel)
          PY
      - name: Install wheel in clean venv and locate resources
        if: matrix.python-version == '3.12'
        run: |
          uv venv /tmp/wheel-venv --python 3.12
          uv pip install --python /tmp/wheel-venv/bin/python dist/*.whl
          /tmp/wheel-venv/bin/python -c "import rnp.resources as r; p = r.r_script('venny.R'); print(p); assert p.is_file()"
          /tmp/wheel-venv/bin/rnp --version

  r-contract:
    name: R enrichment bridge
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglpk-dev libcurl4-openssl-dev libxml2-dev libssl-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff5-dev libjpeg-dev libzstd-dev libbz2-dev liblzma-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true
      - name: Restore R library from renv.lock via project script
        run: |
          set -o pipefail
          bash scripts/restore_r.sh "$RUNNER_TEMP/rlib" | tee "$RUNNER_TEMP/r-restore.log"
          LIB="$(sed -n 's/^R_LIBS=//p' "$RUNNER_TEMP/r-restore.log" | tail -n 1)"
          test -n "$LIB"
          case "$LIB" in /*) ;; *) echo "not an absolute library: $LIB"; exit 1 ;; esac
          echo "R_LIBS=$LIB" >> "$GITHUB_ENV"
      - name: Install from lock file
        run: |
          uv venv --python 3.12
          uv sync --locked --extra dev --extra chem
      - name: Record restored R environment
        run: |
          Rscript -e 'cat(R.version.string, "\n"); cat(.libPaths(), sep = "\n"); suppressMessages(library(clusterProfiler)); cat("clusterProfiler", as.character(packageVersion("clusterProfiler")), "\n")'
      - name: Verify Python-launched R uses the restored library
        env:
          RNP_RSCRIPT: Rscript
        run: |
          uv run python - <<'PY'
          import os
          import subprocess

          completed = subprocess.run(
              [os.environ["RNP_RSCRIPT"], "-e", "cat(.libPaths()[1])"],
              capture_output=True,
              text=True,
              check=False,
          )
          assert completed.returncode == 0, completed.stderr
          actual = completed.stdout.strip()
          assert actual == os.environ["R_LIBS"], (actual, os.environ["R_LIBS"])
          print("python-launched R library:", actual)
          PY
      - name: Live bridge, enrichment and report tests
        env:
          RNP_RSCRIPT: Rscript
        run: |
          uv run pytest -q \
            tests/unit/test_ora_contract.py \
            tests/unit/test_enrich.py \
            tests/unit/test_enrich_benchmark.py \
            tests/unit/test_enrich_wrapper.py \
            tests/unit/test_report.py \
            tests/unit/test_r_environment.py \
            tests/unit/test_case_freeze.py \
            tests/skill/test_skill_scenarios.py
      - name: Full quickstart including enrichment
        env:
          RNP_RSCRIPT: Rscript
        run: |
          uv run rnp ingest stp --config examples/quickstart/run.yaml --run-id quickstart-r
          uv run rnp intersect --config examples/quickstart/run.yaml \
            --targets results/quickstart-r/targets.tsv
          uv run rnp network --config examples/quickstart/run.yaml \
            --intersect results/quickstart-r/intersect
          uv run rnp enrich --config examples/quickstart/run.yaml \
            --intersect results/quickstart-r/intersect
          uv run rnp report --config examples/quickstart/run.yaml \
            --run-dir results/quickstart-r
          uv run rnp manifest --run-dir results/quickstart-r --check-inputs
      - name: Portable case entry end-to-end on synthetic inputs
        env:
          RNP_RSCRIPT: Rscript
        run: |
          OUT="$RUNNER_TEMP/case-entry-e2e"
          uv run python scripts/case_run.py \
            --compounds tests/fixtures/run/inputs/compounds.tsv \
            --stp-dir tests/fixtures/run/inputs/stp \
            --disease-genes tests/fixtures/run/inputs/disease_genes.txt \
            --hgnc-map tests/fixtures/hgnc/hgnc_map.tsv \
            --config-template examples/quickstart/run.yaml \
            --out "$OUT"
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["RUNNER_TEMP"]) / "case-entry-e2e"
          provenance = json.loads((out / "case_provenance.json").read_text(encoding="utf-8"))
          assert provenance["status"] == "complete", provenance
          assert provenance["source"]["hash_rule"]["version"] == "case-source-hash-v2"
          assert any("case_check.py" in c for c in provenance["commands"])
          check = json.loads((out / "independent-check.json").read_text(encoding="utf-8"))
          expected = {
              "0.10": (4, 2, 4, 4),
              "0.05": (5, 3, 5, 6),
          }
          for label, (targets, intersection, nodes, edges) in expected.items():
              run = check["runs"][label]
              assert run["T_r"] == targets, (label, run)
              assert run["intersection"] == intersection, (label, run)
              assert run["network_nodes"] == nodes, (label, run)
              assert run["network_edges"] == edges, (label, run)
          print("portable case entry e2e ok")
          PY
      - name: Portable case entry end-to-end with a submission log on synthetic inputs
        env:
          RNP_RSCRIPT: Rscript
        run: |
          uv run python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          source = root / "tests/fixtures/run/inputs"
          base = Path(os.environ["RUNNER_TEMP"]) / "case-log-e2e"
          base.mkdir()
          compounds = list(
              csv.DictReader((source / "compounds.tsv").open(encoding="utf-8"), delimiter="\t")
          )
          for row, smiles in zip(compounds, ["CCO", "CCC"], strict=True):
              row["smiles"] = smiles
          with (base / "compounds.tsv").open("w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(
                  handle, fieldnames=list(compounds[0]), delimiter="\t", lineterminator="\n"
              )
              writer.writeheader()
              writer.writerows(compounds)
          with (base / "log.tsv").open("w", encoding="utf-8", newline="") as handle:
              writer = csv.writer(handle, delimiter="\t", lineterminator="\n")
              writer.writerow(
                  [
                      "stp_file",
                      "compound",
                      "pubchem_cid",
                      "submitted_structure",
                      "species",
                      "submitted_date",
                      "result_sha256",
                  ]
              )
              for row in compounds:
                  digest = hashlib.sha256((source / "stp" / row["stp_file"]).read_bytes())
                  writer.writerow(
                      [
                          row["stp_file"],
                          row["name"],
                          row["pubchem_cid"],
                          row["smiles"],
                          "Homo sapiens",
                          "2026-10-21",
                          digest.hexdigest(),
                      ]
                  )
          subprocess.run(
              [
                  sys.executable,
                  "scripts/case_run.py",
                  "--compounds",
                  str(base / "compounds.tsv"),
                  "--stp-dir",
                  str(source / "stp"),
                  "--disease-genes",
                  str(source / "disease_genes.txt"),
                  "--hgnc-map",
                  str(root / "tests/fixtures/hgnc/hgnc_map.tsv"),
                  "--log",
                  str(base / "log.tsv"),
                  "--config-template",
                  "examples/quickstart/run.yaml",
                  "--out",
                  str(base / "out"),
              ],
              cwd=root,
              check=True,
          )
          out = base / "out"
          provenance = json.loads((out / "case_provenance.json").read_text(encoding="utf-8"))
          assert provenance["status"] == "complete", provenance
          assert provenance["inputs"]["log"]["policy"] == "case-log-policy-v2"
          structures = provenance["inputs"]["structures"]
          assert structures["mode"] == "structure", structures
          assert structures["submission_status_counts"] == {"verified_kind_unstated": 2}, structures
          assert sorted(provenance["inputs"]["compounds_stage"]) == ["0.05", "0.10"]
          for label in ("0.05", "0.10"):
              stage = out / label / "run_compounds"
              for name in ("compound_structures.tsv", "compounds_audit.json", "run_manifest.json"):
                  assert (stage / name).is_file(), (label, name)
              header = (out / label / "run" / "compounds_registered.tsv").read_text(
                  encoding="utf-8"
              ).splitlines()[0]
              assert header.endswith("structure_id\tstructure_status"), header
          check = json.loads((out / "independent-check.json").read_text(encoding="utf-8"))
          expected = {
              "0.10": (4, 2, 4, 4),
              "0.05": (5, 3, 5, 6),
          }
          for label, (targets, intersection, nodes, edges) in expected.items():
              run = check["runs"][label]
              assert run["T_r"] == targets, (label, run)
              assert run["intersection"] == intersection, (label, run)
              assert run["network_nodes"] == nodes, (label, run)
              assert run["network_edges"] == edges, (label, run)
          print("case entry with a submission log e2e ok")
          PY
      - name: Portable case entry rejects wrong submitted structure
        run: |
          uv run python - <<'PY'
          import csv
          import hashlib
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          root = Path.cwd()
          with tempfile.TemporaryDirectory() as raw:
              tmp = Path(raw)
              compounds = list(
                  csv.DictReader(
                      (root / "tests/fixtures/run/inputs/compounds.tsv").open(
                          encoding="utf-8"
                      ),
                      delimiter="\t",
                  )
              )
              for row, smiles in zip(compounds, ["CCO", "CCC"], strict=True):
                  row["smiles"] = smiles
              compounds_path = tmp / "compounds.tsv"
              with compounds_path.open("w", encoding="utf-8", newline="") as handle:
                  writer = csv.DictWriter(
                      handle,
                      fieldnames=list(compounds[0]),
                      delimiter="\t",
                      lineterminator="\n",
                  )
                  writer.writeheader()
                  writer.writerows(compounds)
              log = tmp / "log.tsv"
              with log.open("w", encoding="utf-8", newline="") as handle:
                  writer = csv.writer(handle, delimiter="\t", lineterminator="\n")
                  writer.writerow(
                      [
                          "stp_file",
                          "compound",
                          "pubchem_cid",
                          "submitted_structure",
                          "species",
                          "submitted_date",
                          "result_sha256",
                      ]
                  )
                  for row in compounds:
                      stp = row["stp_file"]
                      writer.writerow(
                          [
                              stp,
                              row["name"],
                              row["pubchem_cid"],
                              "C",
                              "Homo sapiens",
                              "2026-10-21",
                              hashlib.sha256(
                                  (root / "tests/fixtures/run/inputs/stp" / stp).read_bytes()
                              ).hexdigest(),
                          ]
                      )
              result = subprocess.run(
                  [
                      sys.executable,
                      "scripts/case_run.py",
                      "--compounds",
                      str(compounds_path),
                      "--stp-dir",
                      str(root / "tests/fixtures/run/inputs/stp"),
                      "--disease-genes",
                      str(root / "tests/fixtures/run/inputs/disease_genes.txt"),
                      "--hgnc-map",
                      str(root / "tests/fixtures/hgnc/hgnc_map.tsv"),
                      "--log",
                      str(log),
                      "--preflight-only",
                      "--out",
                      str(tmp / "out"),
                  ],
                  cwd=root,
                  capture_output=True,
                  text=True,
              )
              assert result.returncode != 0, result
              assert "submitted_structure" in result.stderr, result.stderr
          print("invalid submitted structure rejected")
          PY
