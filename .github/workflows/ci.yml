name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install from lock file
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
      - name: CLI quickstart (enrichment is covered by the R job)
        run: |
          uv run rnp --version
          uv run rnp validate --config examples/quickstart/run.yaml
          uv run rnp ingest stp --config examples/quickstart/run.yaml --run-id quickstart
          uv run rnp intersect --config examples/quickstart/run.yaml \
            --targets results/quickstart/targets.tsv
          uv run rnp network --config examples/quickstart/run.yaml \
            --intersect results/quickstart/intersect
          uv run rnp report --config examples/quickstart/run.yaml \
            --run-dir results/quickstart
          uv run rnp manifest --run-dir results/quickstart --check-inputs
      - name: Offline synthetic demo
        run: uv run python scripts/synthetic_demo.py --out .demo
      - name: Build wheel and check packaged resources
        if: matrix.python-version == '3.12'
        run: |
          uv build --wheel
          python - <<'PY'
          import glob
          import zipfile

          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(name.endswith("rnp/R/venny.R") for name in names), names
          assert any(name.endswith("rnp/schemas/run.schema.json") for name in names), names
          print("wheel resources ok:", wheel)
          PY
      - name: Install wheel in clean venv and locate resources
        if: matrix.python-version == '3.12'
        run: |
          uv venv /tmp/wheel-venv --python 3.12
          uv pip install --python /tmp/wheel-venv/bin/python dist/*.whl
          /tmp/wheel-venv/bin/python -c "import rnp.resources as r; p = r.r_script('venny.R'); print(p); assert p.is_file()"
          /tmp/wheel-venv/bin/rnp --version

  r-contract:
    name: R enrichment bridge
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglpk-dev libcurl4-openssl-dev libxml2-dev libssl-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff5-dev libjpeg-dev libzstd-dev libbz2-dev liblzma-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true
      - name: Restore R library from renv.lock via project script
        run: |
          set -o pipefail
          bash scripts/restore_r.sh "$RUNNER_TEMP/rlib" | tee "$RUNNER_TEMP/r-restore.log"
          LIB="$(sed -n 's/^R_LIBS=//p' "$RUNNER_TEMP/r-restore.log" | tail -n 1)"
          test -n "$LIB"
          case "$LIB" in /*) ;; *) echo "not an absolute library: $LIB"; exit 1 ;; esac
          echo "R_LIBS=$LIB" >> "$GITHUB_ENV"
      - name: Install from lock file
        run: |
          uv venv --python 3.12
          uv sync --locked --extra dev
      - name: Record restored R environment
        run: |
          Rscript -e 'cat(R.version.string, "\n"); cat(.libPaths(), sep = "\n"); suppressMessages(library(clusterProfiler)); cat("clusterProfiler", as.character(packageVersion("clusterProfiler")), "\n")'
      - name: Verify Python-launched R uses the restored library
        env:
          RNP_RSCRIPT: Rscript
        run: |
          uv run python - <<'PY'
          import os
          import subprocess

          completed = subprocess.run(
              [os.environ["RNP_RSCRIPT"], "-e", "cat(.libPaths()[1])"],
              capture_output=True,
              text=True,
              check=False,
          )
          assert completed.returncode == 0, completed.stderr
          actual = completed.stdout.strip()
          assert actual == os.environ["R_LIBS"], (actual, os.environ["R_LIBS"])
          print("python-launched R library:", actual)
          PY
      - name: Live bridge, enrichment and report tests
        env:
          RNP_RSCRIPT: Rscript
        run: |
          uv run pytest -q \
            tests/unit/test_ora_contract.py \
            tests/unit/test_enrich.py \
            tests/unit/test_enrich_benchmark.py \
            tests/unit/test_enrich_wrapper.py \
            tests/unit/test_report.py \
            tests/unit/test_r_environment.py \
            tests/unit/test_case_freeze.py \
            tests/skill/test_skill_scenarios.py
      - name: Full quickstart including enrichment
        env:
          RNP_RSCRIPT: Rscript
        run: |
          uv run rnp ingest stp --config examples/quickstart/run.yaml --run-id quickstart-r
          uv run rnp intersect --config examples/quickstart/run.yaml \
            --targets results/quickstart-r/targets.tsv
          uv run rnp network --config examples/quickstart/run.yaml \
            --intersect results/quickstart-r/intersect
          uv run rnp enrich --config examples/quickstart/run.yaml \
            --intersect results/quickstart-r/intersect
          uv run rnp report --config examples/quickstart/run.yaml \
            --run-dir results/quickstart-r
          uv run rnp manifest --run-dir results/quickstart-r --check-inputs
