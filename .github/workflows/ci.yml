name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: lint + tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: CLI smoke test
        run: |
          rnp --version
          rnp validate --config tests/fixtures/run/run.yaml
          rnp ingest stp --config tests/fixtures/run/run.yaml --run-id ci-smoke
          rnp intersect --config tests/fixtures/run/run.yaml \
            --targets tests/fixtures/run/_out/ci-smoke/targets.tsv
          rnp network --config tests/fixtures/run/run.yaml \
            --intersect tests/fixtures/run/_out/ci-smoke/intersect
          rnp manifest --run-dir tests/fixtures/run/_out/ci-smoke --check-inputs
      - name: Offline synthetic demo
        run: python scripts/synthetic_demo.py --out .demo
      - name: Build wheel and check packaged resources
        if: matrix.python-version == '3.12'
        run: |
          pip wheel . -w dist --no-deps
          python - <<'PY'
          import glob
          import zipfile

          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(name.endswith("rnp/R/venny.R") for name in names), names
          assert any(name.endswith("rnp/schemas/run.schema.json") for name in names), names
          print("wheel resources ok:", wheel)
          PY
      - name: Install wheel in clean venv and locate resources
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --upgrade pip
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/python -c "import rnp.resources as r; p = r.r_script('venny.R'); print(p); assert p.is_file()"
          /tmp/wheel-venv/bin/rnp --version

  r-contract:
    name: R enrichment bridge
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libglpk-dev libcurl4-openssl-dev libxml2-dev libssl-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true
      - name: Install Bioconductor packages
        run: |
          install.packages("BiocManager", repos = "https://cloud.r-project.org")
          BiocManager::install(
            c("clusterProfiler", "org.Hs.eg.db"),
            ask = FALSE, update = FALSE
          )
        shell: Rscript {0}
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Live bridge and enrichment tests
        env:
          RNP_RSCRIPT: Rscript
        run: |
          pytest -q \
            tests/unit/test_ora_contract.py \
            tests/unit/test_enrich.py \
            tests/unit/test_enrich_benchmark.py
