[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "reproducible-network-pharmacology"
version = "0.1.0"
description = "Reproducible network-pharmacology workflows as a CLI and an agent skill"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yiming Zhu" }]
keywords = [
    "network-pharmacology",
    "bioinformatics",
    "reproducibility",
    "agent-skills",
    "drug-target",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: R",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "openpyxl>=3.1",
    "jsonschema>=4.21",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
rnp = "rnp.cli:main"

[project.urls]
Homepage = "https://github.com/zym137706-ops/reproducible-network-pharmacology"
Issues = "https://github.com/zym137706-ops/reproducible-network-pharmacology/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rnp"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "rnp/schemas"
"R" = "rnp/R"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
