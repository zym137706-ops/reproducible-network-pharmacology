# Documented quickstart: same config used by README and CI.
# Inputs are the self-contained synthetic fixtures; outputs land in <repo>/results.
project: quickstart
description: Self-contained quickstart on synthetic fixtures (not scientific evidence)
species: Homo_sapiens
inputs:
  compounds: ../../tests/fixtures/run/inputs/compounds.tsv
  stp_dir: ../../tests/fixtures/run/inputs/stp
  disease_genes: ../../tests/fixtures/run/inputs/disease_genes.txt
  hgnc_map: ../../tests/fixtures/hgnc/hgnc_map.tsv
  disease_source: fixture
  disease_retrieval_date: "2026-10-01"
thresholds:
  stp_probability: 0.10
  note: fixture threshold, not a recommendation
enrichment:
  engine: r
  gene_sets: GO_BP
  p_adjust: BH
  pvalue_cutoff: 0.05
  qvalue_cutoff: 0.2
  min_gssize: 5
  max_gssize: 500
  universe_file: ../../tests/fixtures/run/inputs/universe.txt
network:
  disease_label: Fixture disease
references:
  hgnc: "2026-09"
  go: "2026-09-01"
outputs:
  dir: ../../results
