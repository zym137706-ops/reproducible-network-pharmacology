blocked_reason:
- STP exports require manual submission; automatic submission is prohibited.
- The specific CTD disease term/query, release and redistribution terms are not recorded.
- The explicit enrichment background is not chosen or documented.
- No disease, STP, background or expected-output evidence exists yet; HGNC and local
  PubChem structures are prepared but do not make the case complete.
- The verified Linux environment is available, but it cannot compute a case with absent
  inputs.
verification_environment:
  linux_ci:
    workflow: .github/workflows/ci.yml
    run: https://github.com/zym137706-ops/reproducible-network-pharmacology/actions/runs/39415883483
    result: 4/4 jobs success; renv restore and full synthetic quickstart passed
    caveat: this verifies machinery, not the public scientific case
  windows:
    status: unverified_blocked
    evidence: Codex isolated-library run 119 passed / 11 failed, R subprocess exit
      3221225477 (0xC0000005)
    policy: keep the non-zero exit guard; do not mask failures or use Windows as the
      case environment
    record: docs/environment.md and this file
handoff:
- ask_researcher_for: exact CTD disease term, query, release, inclusion/exclusion
    rules, retrieval date and redistribution terms
- ask_researcher_for: eight manual STP exports plus the completed STP-SUBMISSION-LOG.tsv
    rows and service-terms evidence
- ask_researcher_for: explicit enrichment universe list and the reason for choosing
    it
- then: record all hashes in this file, change status to frozen, run the chain in
    Linux CI
- then: create expected outputs and only then update the case README
next_action_when_inputs_exist:
- record every source/query/date/hash/licence above; replace status blocked with frozen
- run the full chain in the verified Linux CI environment
- publish case results only if the checklist in docs/public-case-checklist.md is complete
