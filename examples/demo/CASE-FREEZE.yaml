case_id: demo-public-compounds
status: blocked
frozen_at_utc: "2026-10-20T10:45:00Z"
case_computed_in_linux: false
public_case_claim: false
reason: >-
  The recorded compound and analysis decisions are frozen, but the disease gene
  list and the eight manual SwissTargetPrediction exports are absent, and the
  redistribution/license evidence for the disease list has not been checked.
  Without those inputs no scientific case can be computed; the synthetic
  quickstart is not a substitute.

recorded_scientific_decisions:
  compound_list:
    file: inputs/compounds.tsv
    count: 8
    identity: PubChem CID
    compounds:
      - {name: Quercetin, pubchem_cid: "5280343"}
      - {name: Kaempferol, pubchem_cid: "5280863"}
      - {name: Luteolin, pubchem_cid: "5280445"}
      - {name: Apigenin, pubchem_cid: "5280443"}
      - {name: Naringenin, pubchem_cid: "932"}
      - {name: Catechin, pubchem_cid: "9064"}
      - {name: Gallic acid, pubchem_cid: "370"}
      - {name: Chlorogenic acid, pubchem_cid: "1794427"}
    smiles_status: pending_v0.2 (not required for the v0.1 name/export pipeline)
  stp_probability: 0.10
  sensitivity_probability: 0.05
  enrichment:
    gene_sets: GO_BP
    p_adjust: BH
    pvalue_cutoff: 0.05
    qvalue_cutoff: 0.2
    min_gssize: 10
    max_gssize: 500
    universe: explicit file required; never the annotated genome
  disease_source: CTD
  stp_submission: manual by researcher; never automated

required_inputs_missing:
  - id: disease_genes
    path: inputs/disease_genes.txt
    needs:
      - exact CTD disease term and query string
      - retrieval date and CTD release
      - CTD redistribution/license evidence for this release
      - SHA-256, row count and gene-identifier namespace
    owner: researcher
  - id: stp_exports
    path: inputs/stp/<compound>.csv
    needs:
      - eight manual SwissTargetPrediction exports for Homo sapiens
      - per-compound submission/retrieval log (date, species, query structure)
      - service terms evidence and SHA-256 per file
    owner: researcher
  - id: hgnc_map
    path: inputs/hgnc_map.tsv
    needs:
      - complete-set HGNC release/date
      - retrieval date, SHA-256 and license/attribution evidence
    owner: researcher
  - id: expected_outputs
    path: expected/
    needs:
      - golden outputs only after the inputs are frozen and the full chain runs
      - declared numeric tolerances for enrichment
    owner: agent+researcher
  - id: case_readme
    path: README.md
    needs:
      - exact sources, queries, retrieval dates, licenses and what is not verified
      - no claim of mechanism, efficacy or completed public case
    owner: agent+researcher

blocked_reason:
  - "STP exports require manual submission; automatic submission is prohibited."
  - "The specific CTD disease term and its redistribution terms are not recorded."
  - "No source file has a verified hash yet, so no source is marked frozen."
  - "The verified Linux environment is available, but it cannot compute a case with absent inputs."

verification_environment:
