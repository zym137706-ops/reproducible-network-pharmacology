public_release_gaps:
- id: ctd_permission
  what: written/clarified permission for the 179-gene subset and derived outputs on
    public GitHub/releases
  owner: researcher + CTD
  status: pending
- id: stp_permission
  what: confirmation whether the eight exports and derived tables are Licensed Materials
    under CC BY 4.0
  owner: researcher + STP
  status: pending
- id: public_artifacts
  what: commit restricted inputs/expected outputs only if permission covers them;
    otherwise publish query/filtering recipe and checksums
  owner: researcher + agent
  status: pending
public_release_actions:
- record the official replies; do not treat the current project record as written
  permission
- if permitted, add the covered subset/results with attribution/licence and rerun
  from a clean clone
- if not permitted, keep the local case and publish only code, synthetic examples,
  a reproducible query/filtering recipe and checksums
- do not change the completed local status into a public-case pass without the permission
  gate
